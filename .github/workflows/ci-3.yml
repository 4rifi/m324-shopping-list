name: GitHub Actions Fallstudie

on:
  push:
    branches:
      - main

jobs:
  # Aufgabe 3 - own job, only checks the code style
  lint:
    name: Linting
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails the pipeline on any ESLint error or warning
      - name: Run linter
        run: npm run lint

  # Aufgabe 3 - own job, runs in parallel with the linting job
  test:
    name: Testing
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails the pipeline on any failing Jest test
      - name: Run tests
        run: npm test -- --ci

  # Only starts once linting and testing have both passed
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the app
        run: npm run build

      - name: List the build output
        run: ls -la .next

  # Aufgabe 3 - simulated deployment, needs no checkout
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Simulate deployment
        run: echo "Deployment successful"
