name: GitHub Actions Fallstudie

on:
  push:
    branches:
      - main

jobs:
  Explore-GitHub-Actions:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # Aufgabe 1.3
      - name: Install dependencies
        run: npm ci

      # Aufgabe 1.3
      - name: Build the app
        run: npm run build

      # Aufgabe 1.3
      - name: List the build output
        run: ls -la build
