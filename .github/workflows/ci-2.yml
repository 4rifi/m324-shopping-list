name: GitHub Actions Fallstudie

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Aufgabe 2a - Linting: fails the pipeline on any ESLint error or warning
      - name: Run linter
        run: npm run lint

      # Aufgabe 2a/2b - Tests: fails the pipeline on any failing Jest test
      - name: Run tests
        run: npm test -- --ci

      - name: Build the app
        run: npm run build

      - name: List the build output
        run: ls -la .next
